<!-- The expanded viewBox gives Finder a 7.1% transparent edge around the tile.
     Its 85.7% footprint matches current macOS system app icons without returning
     to the oversized full-bleed v0.0.1 artwork. -->
<svg viewBox="-3 -3 70 70" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="chrome: Soft joins">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22344f"/><stop offset="1" stop-color="#070d18"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#eaf3ff"/><stop offset="1" stop-color="#c2dbfa"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#56a8f2"/><stop offset="1" stop-color="#1c5ca8"/>
    </linearGradient>
    <filter id="shadow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.7" flood-color="#03101f" flood-opacity=".55"/>
    </filter>
  <linearGradient id="symbol-blue" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="32"><stop offset="0" stop-color="#56a8f2"/><stop offset="1" stop-color="#1c5ca8"/></linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#tile)"/>
  <rect x="2" y="2" width="60" height="26" rx="16" fill="#fff" opacity=".07"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15" fill="none" stroke="#fff" stroke-opacity=".08"/>
  <!-- Shared shield: 10% larger about its original bounds center (32, 31.5). -->
  <g id="vault-shield" transform="translate(32 31.5) scale(1.1) translate(-32 -31.5)">
  <g filter="url(#shadow)"><path d="M32 13 16 19v13.2c0 9.4 6.6 15.3 16 17.8 9.4-2.5 16-8.4 16-17.8V19L32 13Z" fill="url(#white)"/></g>
  <path d="M32 13 16 19v13.2c0 9.4 6.6 15.3 16 17.8V13Z" fill="#bcd6f6" opacity=".55"/>
  </g>
  <!-- Platform symbols are composed separately above this shared base. -->
<g id="platform-symbol" transform="translate(20 18.5) scale(0.75)"><g fill="url(#symbol-blue)"><path d="M18.2693 1.1727 A15.0 15.0 0 0 1 29.9755 21.4484 Q29.5388 22.4577 28.5459 21.9841 L24.033 19.8315 Q23.0402 19.358 23.4423 18.3351 A7.8 7.8 0 0 0 17.6989 8.3873 Q16.612 8.224 16.6983 7.1274 L17.0906 2.1428 Q17.1769 1.0462 18.2693 1.1727 Z"/><path d="M27.7062 25.379 A15.0 15.0 0 0 1 4.2938 25.379 Q3.6381 24.4961 4.5446 23.873 L8.6653 21.041 Q9.5718 20.418 10.2566 21.2776 A7.8 7.8 0 0 0 21.7434 21.2776 Q22.4282 20.418 23.3347 21.041 L27.4554 23.873 Q28.3619 24.4961 27.7062 25.379 Z"/><path d="M2.0245 21.4484 A15.0 15.0 0 0 1 13.7307 1.1727 Q14.8231 1.0462 14.9094 2.1428 L15.3017 7.1274 Q15.388 8.224 14.3011 8.3873 A7.8 7.8 0 0 0 8.5577 18.3351 Q8.9598 19.358 7.967 19.8315 L3.4541 21.9841 Q2.4612 22.4577 2.0245 21.4484 Z"/><circle cx="16" cy="16" r="5.7"/></g></g>
</svg>
